name: build profile assets

on:
  schedule:
    - cron: "17 */6 * * *"    # every 6h - picks up new blog posts
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

# never let two runs push at once
concurrency:
  group: profile-assets
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # contribution-graph snake animation -> assets/snake*.svg
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake.svg?palette=github-dark&color_snake=#00ff9c&color_dots=#161b22,#0e4429,#006d32,#26a641,#00ff9c
            assets/snake-light.svg?palette=github-light&color_snake=#00b377

      # 3D isometric contribution calendar -> profile-3d-contrib/*.svg
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # self-hosted stats card -> assets/stats.svg
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: sync latest writeups from blog.reapsec.com
        run: python3 scripts/gen_blog.py

      - name: commit assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets profile-3d-contrib README.md
          git diff --staged --quiet && { echo "nothing to commit"; exit 0; }
          git commit -m "chore: rebuild profile assets [skip ci]"
          # retry against concurrent pushes instead of failing the run
          for i in 1 2 3; do
            git pull --rebase --autostash origin master && git push && exit 0
            echo "push attempt $i failed, retrying..."; sleep 5
          done
          echo "could not push after 3 attempts"; exit 1
